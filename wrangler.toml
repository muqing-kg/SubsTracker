name = "subscription-muqing"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "subscription-muqing"

[env.staging]
name = "subscription-muqing-staging"

# KV 命名空间配置（保留本 fork 部署 ID）
[[kv_namespaces]]
binding = "SUBSCRIPTIONS_KV"
preview_id = "1bf87fe83514481ab3d7fa6cd25c200f"
id = "1bf87fe83514481ab3d7fa6cd25c200f"

# 静态资源：托管 public/ 目录（上游 v3 结构）
[assets]
directory = "./public"
binding = "ASSETS"

# 定时任务配置 - 每天早上 8 点检查（UTC）
[triggers]
crons = ["0 8 * * *"]

# 环境变量（可选，也可以在 Cloudflare Dashboard 中设置）
[vars]
ENVIRONMENT = "production"